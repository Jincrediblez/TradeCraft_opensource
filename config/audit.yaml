thresholds:
  overtrading:
    daily_trades_spike_sigma: 2.0
    friction_cost_pct: 15.0
    holding_days_compression_pct: 50.0
    max_annual_turnover: 10.0
    round_trip_3d_threshold: 5

  fomo:
    high_fomo_threshold: 70
    high_fomo_trade_pct: 20.0
    post_entry_drawdown_pct: 10.0
    post_entry_drawdown_trade_pct: 30.0
    vs_theme_underperform_pct: 40.0

  optionality:
    max_optionality_notional_pct: 25.0
    max_optionality_loss_contribution_pct: 40.0
    min_optionality_win_rate: 0.35
    max_optionality_holding_days: 5

  margin:
    max_portfolio_beta_with_margin: 1.5
    max_single_theme_pct: 50.0
    max_top3_concentration_pct: 70.0
    high_beta_threshold: 1.5
    estimated_drawdown_pct: -30.0
    estimated_loss_nav_pct: 50.0

  sell_fly:
    sell_fly_ratio_threshold: 0.25
    missed_upside_vs_pnl_threshold: 0.20
    loser_holding_ratio: 1.5
    max_loser_add_count: 3

  theme_judgment:
    theme_vs_benchmark_ratio: 0.5
    unclassified_loss_contribution_pct: 30.0

  stock_selection:
    negative_selection_alpha_pct: -3.0
    selection_loss_contribution_pct: 40.0
    weak_theme_trade_count: 3

llm:
  provider: kimi
  model: kimi-latest
  temperature: 0.3
  max_tokens: 4000
  report_language: zh
  api_key_env: KIMI_API_KEY
